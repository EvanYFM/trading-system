<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="ts-title ts-desc">
  <title id="ts-title">期货席位资金面分析</title>
  <desc id="ts-desc">跟踪奇货可查主要期货公司席位资金面变化，按内资、外资正向解读、家人反向解读，输出三方共振与每日历史快照。</desc>

  <defs>
    <style>
      .sans  { font-family: "PingFang SC", "Microsoft YaHei", "Segoe UI", sans-serif; }
      .mono  { font-family: ui-monospace, "SFMono-Regular", Menlo, monospace; }
      .paper { fill: #e8e4da; }
      .gray  { fill: #8f8a80; }
      .dim   { fill: #b8b2a6; }
      .up    { fill: #e0563f; }
      .down  { fill: #2f9e6e; }
    </style>
  </defs>

  <!-- 深墨底 -->
  <rect width="1200" height="340" fill="#12100e"/>

  <!-- 左：标题区 -->
  <g transform="translate(56 0)">
    <text class="sans gray" x="0" y="60" font-size="15" letter-spacing="0.3em">SEAT CAPITAL ANALYSIS · 席位资金面</text>
    <text class="sans paper" x="0" y="128" font-size="56" font-weight="700" letter-spacing="0.04em">期货席位资金面分析</text>
    <text class="sans dim" x="0" y="184" font-size="20" letter-spacing="0.06em">跟踪主要期货公司席位资金面变化，输出三方共振与每日快照</text>

    <text class="sans gray" x="0" y="238" font-size="17" letter-spacing="0.22em">内资 · 外资 · 家人</text>

    <line x1="0" y1="268" x2="560" y2="268" stroke="#3a3630" stroke-width="1"/>
    <text class="mono gray" x="0" y="300" font-size="14" letter-spacing="0.06em">QUHE KECHA · RESEARCH DASHBOARD · DAILY SNAPSHOTS</text>
  </g>

  <!-- 右：席位分组与共振观察面板 -->
  <g transform="translate(672 40)">
    <rect width="472" height="260" rx="12" fill="#1b1916" stroke="#2a2723" stroke-width="1"/>
    <text class="sans gray" x="22" y="30" font-size="14" letter-spacing="0.18em">席位分组 · 三方共振观察</text>

    <g transform="translate(22 0)">
      <!-- 内资 11 家 正向 -->
      <g transform="translate(0 56)">
        <circle cx="6" cy="7" r="5" fill="#e0563f"/>
        <text class="sans paper" x="24" y="11" font-size="18">内资</text>
        <rect x="88" y="1" width="176" height="12" rx="6" fill="#3a3630"/>
        <rect x="88" y="1" width="161" height="12" rx="6" fill="#e0563f"/>
        <text class="mono paper" x="280" y="11" font-size="15">11 家</text>
        <text class="sans up" x="344" y="11" font-size="15" font-weight="700">正向</text>
      </g>
      <!-- 外资 3 家 正向 -->
      <g transform="translate(0 100)">
        <circle cx="6" cy="7" r="5" fill="#e0563f"/>
        <text class="sans paper" x="24" y="11" font-size="18">外资</text>
        <rect x="88" y="1" width="176" height="12" rx="6" fill="#3a3630"/>
        <rect x="88" y="1" width="44" height="12" rx="6" fill="#e0563f"/>
        <text class="mono paper" x="280" y="11" font-size="15">3 家</text>
        <text class="sans up" x="344" y="11" font-size="15" font-weight="700">正向</text>
      </g>
      <!-- 家人 12 家 反向 -->
      <g transform="translate(0 144)">
        <circle cx="6" cy="7" r="5" fill="#2f9e6e"/>
        <text class="sans paper" x="24" y="11" font-size="18">家人</text>
        <rect x="88" y="1" width="176" height="12" rx="6" fill="#3a3630"/>
        <rect x="88" y="1" width="176" height="12" rx="6" fill="#2f9e6e"/>
        <text class="mono paper" x="280" y="11" font-size="15">12 家</text>
        <text class="sans down" x="344" y="11" font-size="15" font-weight="700">反向</text>
      </g>
    </g>

    <!-- 共振行 -->
    <g transform="translate(22 212)">
      <line x1="0" y1="-10" x2="428" y2="-10" stroke="#2a2723" stroke-width="1"/>
      <circle cx="6" cy="0" r="4" fill="#e0563f"/>
      <circle cx="18" cy="0" r="4" fill="#e0563f"/>
      <circle cx="30" cy="0" r="4" fill="#2f9e6e"/>
      <path d="M 40 0 L 96 0" stroke="#5a554c" stroke-width="1.5"/>
      <rect x="104" y="-12" width="132" height="24" rx="12" fill="#e8e4da"/>
      <text class="sans paper" x="170" y="5" font-size="15" text-anchor="middle" fill="#12100e">三方共振</text>
      <text class="sans gray" x="240" y="4" font-size="14">内外同向 · 家人反向验证</text>
    </g>
  </g>
</svg>
